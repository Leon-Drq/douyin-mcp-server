<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文案提取 — Transcript</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #F8F7F3;
            --text: #1A1A1A;
            --text-secondary: #666666;
            --border: #D8D7D3;
            --border-light: #E8E7E3;
            --accent: #1A1A1A;
            --mono: 'IBM Plex Mono', monospace;
            --serif: 'EB Garamond', Georgia, serif;
        }

        html { font-size: 16px; }

        body {
            font-family: var(--serif);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); }

        /* Layout */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* Header */
        header {
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        .header-inner {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
        }

        .site-title {
            font-family: var(--serif);
            font-size: 1.125rem;
            font-weight: 500;
            letter-spacing: 0.01em;
        }

        .site-title span {
            font-style: italic;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .api-status {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            transition: color 0.15s;
            background: none;
            border: none;
            padding: 0;
        }

        .api-status:hover { color: var(--text); }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #999;
            flex-shrink: 0;
        }

        .status-dot.connected { background: #2a7a2a; }

        /* Main */
        main {
            padding: 56px 0 80px;
        }

        /* Section heading */
        .section-label {
            font-family: var(--mono);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        /* Input area */
        .input-section {
            margin-bottom: 40px;
        }

        textarea {
            width: 100%;
            font-family: var(--mono);
            font-size: 0.8125rem;
            line-height: 1.7;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            padding: 16px;
            resize: vertical;
            min-height: 100px;
            outline: none;
            transition: border-color 0.15s;
        }

        textarea::placeholder { color: #AAAA9F; }
        textarea:focus { border-color: var(--text); }
        textarea:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Actions */
        .actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: var(--mono);
            font-size: 0.6875rem;
            letter-spacing: 0.05em;
            padding: 9px 20px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }

        .btn:hover:not(:disabled) {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .btn-primary:hover:not(:disabled) {
            background: #333;
            border-color: #333;
        }

        .btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .hint {
            font-family: var(--mono);
            font-size: 0.625rem;
            color: var(--text-secondary);
            margin-left: auto;
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid var(--border-light);
            margin: 40px 0;
        }

        /* Video info */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            border: 1px solid var(--border);
            margin-bottom: 40px;
        }

        .info-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
        }

        .info-item:nth-child(odd) { border-right: 1px solid var(--border-light); }

        .info-item:last-child,
        .info-item:nth-last-child(2):nth-child(odd) {
            border-bottom: none;
        }

        .info-key {
            font-family: var(--mono);
            font-size: 0.625rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .info-val {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text);
            word-break: break-all;
        }

        .info-val.title-val {
            font-family: var(--serif);
            font-size: 0.9375rem;
            word-break: normal;
        }

        /* Download link */
        .download-row {
            margin-bottom: 40px;
        }

        .download-link {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text);
            text-decoration: underline;
            text-underline-offset: 3px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            text-align: left;
        }

        .download-link:hover { color: var(--text-secondary); }

        /* Transcript */
        .transcript-section {}

        .transcript-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .transcript-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .text-btn {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
            padding: 0;
            transition: color 0.15s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .text-btn:hover { color: var(--text); }

        .word-count {
            font-family: var(--mono);
            font-size: 0.625rem;
            color: var(--text-secondary);
        }

        .transcript-body {
            font-family: var(--serif);
            font-size: 1.0625rem;
            line-height: 1.8;
            color: var(--text);
            border-top: 1px solid var(--border);
            padding-top: 24px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Loading */
        .loading-area {
            padding: 32px 0;
        }

        .loading-text {
            font-family: var(--mono);
            font-size: 0.8125rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%   { content: ''; }
            25%  { content: '.'; }
            50%  { content: '..'; }
            75%  { content: '...'; }
            100% { content: ''; }
        }

        .steps-list {
            margin-top: 20px;
            list-style: none;
        }

        .steps-list li {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            padding: 6px 0;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .steps-list li.active { color: var(--text); }
        .steps-list li.done { color: #2a7a2a; }

        .step-marker {
            font-family: var(--mono);
            font-size: 0.625rem;
            width: 16px;
            flex-shrink: 0;
        }

        /* Error */
        .error-area {
            border-left: 2px solid #8B1A1A;
            padding: 12px 16px;
            margin-top: 16px;
        }

        .error-text {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: #8B1A1A;
            line-height: 1.6;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(248, 247, 243, 0.92);
            backdrop-filter: blur(2px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            max-width: 480px;
            width: 100%;
            padding: 40px;
        }

        .modal-title {
            font-family: var(--serif);
            font-size: 1.25rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .field-label {
            font-family: var(--mono);
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 8px;
        }

        .field-input {
            width: 100%;
            font-family: var(--mono);
            font-size: 0.8125rem;
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.15s;
            letter-spacing: 0.02em;
        }

        .field-input:focus { border-color: var(--text); }

        .field-hint {
            font-family: var(--mono);
            font-size: 0.5625rem;
            color: var(--text-secondary);
            margin-top: 6px;
            line-height: 1.6;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .modal-close {
            position: absolute;
            top: 0;
            right: 0;
        }

        /* API warning inline */
        .api-warning {
            font-family: var(--mono);
            font-size: 0.6875rem;
            color: var(--text-secondary);
            margin-top: 10px;
            cursor: pointer;
        }

        .api-warning u { text-underline-offset: 3px; }
        .api-warning:hover { color: var(--text); }

        /* Footer */
        footer {
            border-top: 1px solid var(--border-light);
            padding: 20px 0;
        }

        .footer-text {
            font-family: var(--mono);
            font-size: 0.5625rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .footer-text a {
            color: inherit;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .footer-text a:hover { color: var(--text); }

        /* Fade */
        [x-cloak] { display: none !important; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-up { animation: fadeUp 0.25s ease-out; }

        /* Responsive */
        @media (max-width: 640px) {
            .header-inner { flex-direction: column; gap: 8px; }
            .info-grid { grid-template-columns: 1fr; }
            .info-item:nth-child(odd) { border-right: none; }
            .info-item { border-bottom: 1px solid var(--border-light); }
            .info-item:last-child { border-bottom: none; }
            .modal { padding: 28px 20px; }
            main { padding: 36px 0 60px; }
        }
    </style>
</head>
<body x-data="app()" x-init="init()" x-cloak>

    <!-- API Settings Modal -->
    <div class="modal-overlay" x-show="showSettings" @click.self="showSettings = false"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-100"
         x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="modal" x-transition:enter="transition ease-out duration-150"
             x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0">
            <h2 class="modal-title">API 配置</h2>
            <p class="modal-desc">
                输入硅基流动 API Key 以启用语音识别功能。<br>
                Key 仅存储于本地浏览器，不上传至服务器。<br>
                <a href="https://cloud.siliconflow.cn/i/TxUlXG3u" target="_blank" style="color: inherit; text-decoration: underline; text-underline-offset: 3px;">获取免费 API Key →</a>
            </p>

            <label class="field-label">Silicon Flow API Key</label>
            <input class="field-input"
                   :type="showKey ? 'text' : 'password'"
                   x-model="apiKeyInput"
                   placeholder="sk-xxxxxxxxxxxxxxxx"
                   @keydown.enter="saveKey">
            <p class="field-hint">
                <span x-show="showKey" @click="showKey = false" style="cursor:pointer; text-decoration: underline; text-underline-offset: 2px;">隐藏</span>
                <span x-show="!showKey" @click="showKey = true" style="cursor:pointer; text-decoration: underline; text-underline-offset: 2px;">显示</span>
                &nbsp;&nbsp;
                <span x-show="apiKey" @click="clearKey" style="cursor:pointer; text-decoration: underline; text-underline-offset: 2px; color: #8B1A1A;">清除已保存</span>
            </p>

            <div class="modal-actions">
                <button class="btn" @click="showSettings = false">取消</button>
                <button class="btn btn-primary" @click="saveKey">保存</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="header-inner">
                <div class="site-title">文案提取 <span>/ Transcript Extractor</span></div>
                <button class="api-status" @click="showSettings = true">
                    <span class="status-dot" :class="{ connected: apiKey }"></span>
                    <span x-text="apiKey ? 'API 已配置' : 'API 未配置 — 点击设置'"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main>
        <div class="container">

            <!-- Input -->
            <div class="input-section">
                <p class="section-label">分享链接</p>
                <textarea
                    x-model="url"
                    placeholder="粘贴抖音分享链接或含链接的文本&#10;例：https://v.douyin.com/xxxxx/"
                    rows="3"
                    :disabled="loading"
                    @keydown.meta.enter="extractText"
                    @keydown.ctrl.enter="extractText"
                ></textarea>

                <div class="actions">
                    <button class="btn" @click="fetchInfo" :disabled="!url.trim() || loading">
                        获取信息
                    </button>
                    <button class="btn btn-primary" @click="extractText" :disabled="!url.trim() || loading || !apiKey">
                        提取文案
                    </button>
                    <span class="hint" x-show="url">⌘ + Enter 快速提取</span>
                </div>

                <div class="api-warning" x-show="!apiKey" @click="showSettings = true">
                    <u>配置 API Key</u> 后可提取文案（获取信息无需 API）
                </div>
            </div>

            <!-- Error -->
            <div class="error-area fade-up" x-show="error" x-cloak>
                <p class="error-text" x-text="error"></p>
            </div>

            <!-- Loading -->
            <div class="loading-area" x-show="loading" x-cloak>
                <p class="loading-text">
                    <span class="loading-dots" x-text="loadingMsg"></span>
                </p>
                <ul class="steps-list" x-show="isExtract">
                    <template x-for="(s, i) in steps" :key="i">
                        <li :class="{ active: step === i + 1, done: step > i + 1 }">
                            <span class="step-marker" x-text="step > i + 1 ? '✓' : (step === i + 1 ? '→' : '·')"></span>
                            <span x-text="s"></span>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Video Info -->
            <div class="fade-up" x-show="videoInfo && !loading" x-cloak>
                <p class="section-label">视频信息</p>
                <div class="info-grid">
                    <div class="info-item" style="grid-column: 1 / -1;">
                        <p class="info-key">标题</p>
                        <p class="info-val title-val" x-text="videoInfo?.title || '—'"></p>
                    </div>
                    <div class="info-item">
                        <p class="info-key">视频 ID</p>
                        <p class="info-val" x-text="videoInfo?.video_id || '—'"></p>
                    </div>
                    <div class="info-item">
                        <p class="info-key">无水印下载</p>
                        <a x-show="videoInfo?.download_url"
                           :href="`/api/video/download?url=${encodeURIComponent(videoInfo?.download_url || '')}&filename=${encodeURIComponent(videoInfo?.video_id || 'video')}.mp4`"
                           class="download-link">下载原视频 →</a>
                        <span x-show="!videoInfo?.download_url" class="info-val">—</span>
                    </div>
                </div>
            </div>

            <!-- Transcript -->
            <div class="transcript-section fade-up" x-show="transcript && !loading" x-cloak>
                <hr class="divider" x-show="videoInfo">
                <div class="transcript-header">
                    <p class="section-label" style="margin-bottom:0;">提取结果</p>
                    <div class="transcript-actions">
                        <span class="word-count" x-text="`${(transcript || '').length} 字`"></span>
                        <button class="text-btn" @click="copyText" x-text="copied ? '已复制' : '复制'"></button>
                        <button class="text-btn" @click="downloadMd">下载 Markdown</button>
                    </div>
                </div>
                <div class="transcript-body" x-text="transcript"></div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="footer-text">
                文案提取器 &nbsp;·&nbsp;
                <a href="https://github.com/yzfly/douyin-mcp-server" target="_blank">GitHub</a>
                &nbsp;·&nbsp;
                使用 <a href="https://cloud.siliconflow.cn/i/TxUlXG3u" target="_blank">SenseVoice</a> 语音识别
            </p>
        </div>
    </footer>

    <script>
        function app() {
            return {
                url: '',
                apiKey: '',
                apiKeyInput: '',
                showKey: false,
                showSettings: false,
                loading: false,
                isExtract: false,
                loadingMsg: '处理中',
                step: 0,
                steps: ['解析分享链接', '下载视频', 'AI 语音识别', '整理文案'],
                videoInfo: null,
                transcript: '',
                error: '',
                copied: false,

                init() {
                    this.apiKey = localStorage.getItem('siliconflow_api_key') || '';
                    this.apiKeyInput = this.apiKey;
                },

                saveKey() {
                    const k = this.apiKeyInput.trim();
                    this.apiKey = k;
                    if (k) localStorage.setItem('siliconflow_api_key', k);
                    else localStorage.removeItem('siliconflow_api_key');
                    this.showSettings = false;
                },

                clearKey() {
                    this.apiKeyInput = '';
                    this.apiKey = '';
                    localStorage.removeItem('siliconflow_api_key');
                    this.showSettings = false;
                },

                reset() {
                    this.videoInfo = null;
                    this.transcript = '';
                    this.error = '';
                    this.copied = false;
                },

                async fetchInfo() {
                    this.reset();
                    this.loading = true;
                    this.isExtract = false;
                    this.loadingMsg = '解析中';
                    try {
                        const res = await fetch('/api/video/info', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: this.url })
                        });
                        const data = await res.json();
                        if (data.success) {
                            this.videoInfo = data;
                        } else {
                            this.error = data.error || '解析失败，请检查链接是否有效';
                        }
                    } catch(e) {
                        this.error = '网络错误：' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                async extractText() {
                    if (!this.apiKey) { this.showSettings = true; return; }
                    this.reset();
                    this.loading = true;
                    this.isExtract = true;
                    this.step = 1;
                    this.loadingMsg = '提取中';

                    const stepTimer = setInterval(() => {
                        if (this.step < this.steps.length) this.step++;
                    }, 6000);

                    try {
                        const res = await fetch('/api/video/extract', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: this.url, api_key: this.apiKey })
                        });
                        const data = await res.json();
                        clearInterval(stepTimer);
                        this.step = this.steps.length + 1;

                        if (data.success) {
                            this.videoInfo = data;
                            this.transcript = data.text || '';
                        } else {
                            this.error = data.error || '提取失败';
                        }
                    } catch(e) {
                        clearInterval(stepTimer);
                        this.error = '网络错误：' + e.message;
                    } finally {
                        this.loading = false;
                    }
                },

                copyText() {
                    if (!this.transcript) return;
                    navigator.clipboard.writeText(this.transcript).then(() => {
                        this.copied = true;
                        setTimeout(() => this.copied = false, 2000);
                    });
                },

                downloadMd() {
                    const title = this.videoInfo?.title || 'transcript';
                    const id = this.videoInfo?.video_id || '';
                    const dl = this.videoInfo?.download_url || '';
                    const now = new Date().toLocaleString('zh-CN');
                    const md = `# ${title}\n\n| 属性 | 值 |\n|------|-----|\n| 视频ID | \`${id}\` |\n| 提取时间 | ${now} |\n| 下载链接 | [点击下载](${dl}) |\n\n---\n\n## 文案内容\n\n${this.transcript}`;
                    const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `${id || 'transcript'}.md`;
                    a.click();
                    URL.revokeObjectURL(a.href);
                }
            }
        }
    </script>
</body>
</html>
